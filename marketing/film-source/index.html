<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SD Wise film</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --blue: #006dd8; --blue2: #3b93ff; --red: #f1002f; --yellow: #ffbe00;
    --slate: #5a6275; --navy: #1d2830; --ink: #0f1b2d; --muted: #5f6b76;
    --email: #2f8cff; --msg: #8b6cff; --meet: #00b39a; --doc: #ffbe00; --mind: #ff3b5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #050b16; }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .abs { position: absolute; }
  .bg-dark { position: absolute; inset: -10%; background:
      radial-gradient(900px 700px at 72% 38%, rgba(0,109,216,.45), transparent 70%),
      radial-gradient(1400px 900px at 30% 110%, rgba(0,70,160,.55), transparent 70%),
      linear-gradient(160deg, #071a36 0%, #04101f 60%, #030a14 100%); }
  .bg-blue { position: absolute; inset: -10%; background:
      radial-gradient(1100px 800px at 70% 30%, #1e7cf0 0%, transparent 70%),
      linear-gradient(150deg, #0a56c4 0%, #0640a0 45%, #04296e 100%); }
  .bg-light { position: absolute; inset: -10%; background:
      radial-gradient(1100px 800px at 50% 45%, #ffffff 0%, #f1f3f7 60%, #e6e9ef 100%); }
  .beam { position: absolute; left: -400px; bottom: -300px; width: 2200px; height: 520px;
      background: linear-gradient(90deg, rgba(255,255,255,.07), rgba(255,255,255,0)); transform: rotate(-14deg); }
  .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 50;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%); }
  .label { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: .22em; text-transform: uppercase;
      display: flex; align-items: center; gap: 16px; }
  .label::before { content: ''; width: 40px; height: 2px; background: currentColor; }
  .h1 { font-weight: 700; font-size: 104px; line-height: 1.0; letter-spacing: -0.045em; }
  .sub { font-size: 28px; line-height: 1.4; font-weight: 400; letter-spacing: -0.01em; }
  .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
  .card { position: absolute; background: #fff; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,10,30,.35), 0 2px 6px rgba(0,10,30,.15); }
  .frag { width: 330px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .frag .ic { flex: none; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .frag .t1 { font-size: 15px; font-weight: 600; color: #1d2830; }
  .frag .t2 { font-size: 13.5px; color: #6b7682; margin-top: 3px; line-height: 1.35; }
  .frag .meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9aa4ae; margin-top: 6px; letter-spacing: .04em; }
  .pill { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
  .tile { position: absolute; width: 112px; height: 112px; border-radius: 30px; background: #fff; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 18px 40px rgba(0,0,0,.35); font-weight: 800; font-size: 50px; letter-spacing: -0.04em; }
  .tile .nm { position: absolute; top: 126px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 500; color: rgba(255,255,255,.75); letter-spacing: 0; white-space: nowrap; }
  .gnode { position: absolute; border-radius: 50%; }
  .gcard { position: absolute; width: 300px; padding: 16px 18px; background: #fff; border-radius: 16px;
      box-shadow: 0 16px 40px rgba(15,27,45,.12), 0 1px 3px rgba(15,27,45,.08); }
  .gcard .t { font-size: 18px; font-weight: 650; color: #0f1b2d; letter-spacing: -0.01em; }
  .gcard .s { font-size: 13px; color: #6b7682; margin-top: 4px; font-family: 'JetBrains Mono', monospace; letter-spacing: .02em; }
  .elabel { position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: .12em;
      padding: 6px 12px; border-radius: 999px; background: #0f1b2d; color: #fff; transform: translate(-50%, -50%); white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font-size: 17px; font-weight: 600; }
  .ui { position: absolute; background: #fff; border-radius: 22px; box-shadow: 0 30px 80px rgba(0,8,25,.45), 0 2px 8px rgba(0,8,25,.2); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------- helpers ----------
const W = 1920, H = 1080;
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const r = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 4);
const ex = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const ei = x => x * x * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const $ = (root, sel) => root.querySelector(sel);
const $$ = (root, sel) => [...root.querySelectorAll(sel)];
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function st(e, o) { for (const k in o) e.style[k] = o[k]; }
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }

const ICONS = {
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  meet: '<path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  doc: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  mind: '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  spark: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  bell: '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
};
const icon = (n, s = 24, c = 'currentColor', w = 2) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const SRC = { mail: 'var(--email)', msg: 'var(--msg)', meet: 'var(--meet)', doc: 'var(--doc)', mind: 'var(--mind)' };

// SD Wise logo: three slanted bars + wordmark (geometry traced from the brand logo)
function logoSVG({ text = true, textColor = '#ffffff', gray = '#8a93ab', h = 160, id = '' } = {}) {
  const vw = text ? 2010 : 510;
  return `<svg ${id ? `id="${id}"` : ''} height="${h}" viewBox="0 0 ${vw} 690" style="overflow:visible">
    <polygon class="lb lb0" points="0,348 85,348 118,537 34,537" fill="${gray}"/>
    <polygon class="lb lb1" points="194,192 286,192 228,690 139,690" fill="#d6003a"/>
    <polygon class="lb lb2" points="405,0 500,0 383,537 292,537" fill="#f4a600"/>
    ${text ? `<g class="lt"><text x="492" y="537" font-family="Open Sans" font-weight="500" font-size="510" letter-spacing="-8" fill="${textColor}" textLength="1515" lengthAdjust="spacingAndGlyphs">sd wise</text></g>` : ''}
  </svg>`;
}
function animLogo(root, lt, t0, { textDelay = 0.9 } = {}) {
  $$(root, '.lb').forEach((b, i) => {
    const x = eo(r(lt, t0 + i * 0.13, t0 + i * 0.13 + 0.7));
    st(b, { transformBox: 'fill-box', transformOrigin: '50% 100%', transform: `scaleY(${x})`, opacity: cl(x * 3) });
  });
  const tg = $(root, '.lt');
  if (tg) { const x = eo(r(lt, t0 + textDelay, t0 + textDelay + 0.9));
    st(tg, { transform: `translateX(${(1 - x) * -120}px)`, opacity: x, filter: `blur(${(1 - x) * 10}px)` }); }
}

// word-by-word reveal
function words(text, cls = '') {
  return text.split(/(\s+)/).map(w => /^\s+$/.test(w) ? w : `<span class="w ${cls}">${w}</span>`).join('');
}
function animWords(spans, lt, t0, { stagger = 0.06, dur = 0.8, dy = 70, blur = 14, outAt = null, outDur = 0.45 } = {}) {
  spans.forEach((s, i) => {
    const x = eo(r(lt, t0 + i * stagger, t0 + i * stagger + dur));
    let o = x, y = (1 - x) * dy, b = (1 - x) * blur;
    if (outAt !== null) { const q = ei(r(lt, outAt + i * 0.025, outAt + i * 0.025 + outDur)); o *= 1 - q; y -= q * 40; b += q * 16; }
    st(s, { opacity: o, transform: `translateY(${y}px)`, filter: b > 0.2 ? `blur(${b}px)` : 'none' });
  });
}
function fadeIn(e, lt, t0, { dur = 0.7, dy = 30, blur = 10, outAt = null, outDur = 0.4, scale = 1 } = {}) {
  const x = eo(r(lt, t0, t0 + dur));
  let o = x, y = (1 - x) * dy, b = (1 - x) * blur, s = lerp(scale, 1, x);
  if (outAt !== null) { const q = ei(r(lt, outAt, outAt + outDur)); o *= 1 - q; b += q * 14; y -= q * 20; }
  st(e, { opacity: o, transform: `translateY(${y}px) scale(${s})`, filter: b > 0.2 ? `blur(${b}px)` : 'none' });
  return x;
}
function sceneExit(root, lt, dur, { at, zoom = 0.08 } = {}) {
  // soft push-in + blur on exit, like a camera move into the next beat
  const q = ei(r(lt, at, dur));
  st(root, { transform: `scale(${1 + q * zoom})`, filter: q > 0.01 ? `blur(${q * 18}px)` : 'none', opacity: 1 - q * 0.9 });
}
function stars(n, seed, color = 'rgba(255,255,255,.5)') {
  const R = rng(seed); let s = '';
  for (let i = 0; i < n; i++) { const z = R(); s += `<div class="abs star" data-p="${R()}" style="left:${R() * W}px;top:${R() * H}px;width:${1 + z * 2.5}px;height:${1 + z * 2.5}px;border-radius:50%;background:${color};opacity:${0.15 + z * 0.5}"></div>`; }
  return s;
}
function animStars(root, lt) { $$(root, '.star').forEach((s, i) => { const p = +s.dataset.p; st(s, { transform: `translate(${Math.sin(lt * 0.3 + p * 9) * 20}px, ${-lt * (8 + p * 18)}px)` }); }); }

const stage = document.getElementById('stage');
const scenes = [];
function scene(a, b, html, init, fn) { const e = el(`<div class="scene">${html}</div>`); stage.appendChild(e); const ctx = init ? init(e) : {}; scenes.push({ a, b, e, fn, ctx }); }

// ================= S1: knowledge scattered everywhere (0 - 10) =================
const FRAGS = [
  ['mail', 'RE: Kras contract – pricing', 'Lotte, confirming €4.20 per payslip, quarterly…', 'OUTLOOK · LOTTE J.'],
  ['msg', '#payroll-benelux', 'Is the Kras go-live still 1 November?', 'SLACK · BRAM D.S.'],
  ['meet', 'Q4 payroll steering', 'Transcript · 47 min · 6 participants', 'TEAMS MEETING'],
  ['doc', 'Onboarding_policy_v7.docx', 'Updated probation rules for new hires', 'SHAREPOINT'],
  ['msg', 'Dario ↔ Victor', 'Fixed the Dimona export, it was the encoding', 'PRIVATE CHAT'],
  ['mind', 'Only An knows', 'How the 2019 indexation exception works', 'IN SOMEONE’S HEAD'],
  ['mail', 'Fwd: Audit findings FY25', 'See attached, please keep confidential', 'OUTLOOK · AUDIT'],
  ['meet', 'Customer escalation – Brouwerij', 'Recording · decisions not written down', 'GOOGLE MEET'],
  ['doc', 'Budget_Q4_final_FINAL.xlsx', '3 versions, nobody knows which is right', 'DRIVE'],
  ['msg', 'who knows the SEPA cut-off?', '12 replies · thread', 'TEAMS CHAT'],
  ['mail', 'Welcome aboard, Kobe', 'Access to the platform repos granted', 'OUTLOOK · IT'],
  ['mind', 'Pieter remembers', 'Why we dropped the old ticketing tool', 'IN SOMEONE’S HEAD'],
  ['meet', 'Sales kick-off 2027', 'Targets agreed verbally', 'ZOOM'],
  ['doc', 'Payroll_legal_BE.pdf', '212 pages · last read 2024', 'SHAREPOINT'],
  ['msg', '#platform', 'Don’t deploy on Fridays, remember March?', 'SLACK · KOBE W.'],
  ['mail', 'Salary review – confidential', 'HR only. Do not forward.', 'OUTLOOK · HR'],
];
scene(0, 10, `
  <div class="bg-dark"></div><div class="beam"></div>
  <div class="abs" id="s1stars" style="inset:0">${stars(90, 7)}</div>
  <div class="abs" id="s1cards" style="inset:0;perspective:1400px;perspective-origin:50% 50%;transform-style:preserve-3d"></div>
  <div class="abs" id="s1count" style="left:0;right:0;top:64px;display:flex;justify-content:center">
    <div class="pill mono" style="padding:10px 20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.8);font-size:18px;letter-spacing:.08em">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--red)"></span><span id="s1n">0</span>&nbsp;FRAGMENTS OF KNOWLEDGE</div></div>
  <div class="abs" id="s1words" style="inset:0"></div>
  <div class="vignette"></div>`,
  e => {
    const R = rng(42), cards = [];
    const box = $(e, '#s1cards');
    for (let i = 0; i < 78; i++) {
      const f = FRAGS[i % FRAGS.length];
      let x, y, tries = 0;
      do { x = -120 + R() * (W + 240); y = 40 + R() * (H - 80); tries++; }
      while (tries < 20 && Math.abs(y - 540) < 150 && Math.abs(x - 960) < 560);
      const c = el(`<div class="card frag"><div class="ic" style="background:${SRC[f[0]]}">${icon(f[0], 20, '#fff')}</div>
        <div><div class="t1">${f[1]}</div><div class="t2">${f[2]}</div><div class="meta">${f[3]}</div></div></div>`);
      box.appendChild(c);
      cards.push({ c, x: x - 165, y: y - 45, z: -900 + R() * 800, s: 0.15 + i * 0.105 + R() * 0.1, rot: (R() - .5) * 16, dr: (R() - .5) * 30 });
    }
    const WORDS = [['mail', 'Emails.', 0.4, 1.9], ['msg', 'Chats.', 1.9, 3.3], ['meet', 'Meetings.', 3.3, 4.7], ['doc', 'Documents.', 4.7, 6.1], ['mind', 'Minds.', 6.1, 7.5]];
    const wb = $(e, '#s1words');
    const ws = WORDS.map(([ic, w, a, b]) => {
      const d = el(`<div class="abs" style="inset:0;display:flex;align-items:center;justify-content:center;gap:34px">
        <div style="width:118px;height:118px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.4)">${icon(ic, 62, SRC[ic], 2.2)}</div>
        <div style="color:#fff;font-weight:800;font-size:176px;letter-spacing:-0.055em;text-shadow:0 10px 60px rgba(0,0,0,.5)">${w}</div></div>`);
      wb.appendChild(d); return { d, a, b };
    });
    const fin = el(`<div class="abs" style="inset:0;display:flex;align-items:center;justify-content:center;text-align:center">
      <div style="color:#fff;font-weight:800;font-size:150px;letter-spacing:-0.055em;line-height:1;text-shadow:0 10px 60px rgba(0,0,0,.6)">${words('Scattered')} ${words('everywhere.', 'yl')}</div></div>`);
    wb.appendChild(fin);
    $$(fin, '.yl').forEach(s => st(s, { background: 'linear-gradient(90deg,#ffbe00,#ff6a3d)', webkitBackgroundClip: 'text', color: 'transparent' }));
    return { cards, ws, fin, finW: $$(fin, '.w') };
  },
  (lt, e, c) => {
    animStars(e, lt);
    const rush = ex(r(lt, 9.0, 10));
    c.cards.forEach(k => {
      const a = eo(r(lt, k.s, k.s + 1.5));
      if (a <= 0) { k.c.style.display = 'none'; return; }
      k.c.style.display = 'flex';
      const z = lerp(-3200, k.z, a) + (lt - k.s) * 55 + rush * 2600;
      const blur = cl(Math.abs(z + 250) / 180, 0, 7);
      const fadeNear = 1 - r(z, 350, 900);
      st(k.c, { transform: `translate3d(${k.x + Math.sin(lt * .4 + k.rot) * 12}px, ${k.y + lt * k.dr * 0.3}px, ${z}px) rotateY(${(k.x + 165 - 960) * -0.012}deg) rotateZ(${k.rot * 0.25}deg)`,
        opacity: a * fadeNear, filter: blur > 0.4 ? `blur(${blur}px)` : 'none' });
    });
    $(e, '#s1n').textContent = fmt(Math.pow(r(lt, 0.2, 9.2), 1.6) * 1284506);
    fadeIn($(e, '#s1count'), lt, 0.1, { outAt: 9.2 });
    c.ws.forEach(({ d, a, b }) => {
      const i = eo(r(lt, a, a + 0.45)), o = ei(r(lt, b - 0.28, b));
      st(d, { opacity: i * (1 - o), transform: `translateY(${(1 - i) * 50 - o * 50}px) scale(${1 + o * 0.04})`, filter: `blur(${(1 - i) * 12 + o * 12}px)` });
    });
    animWords(c.finW, lt, 7.5, { stagger: 0.12, dur: 0.7, outAt: 9.25 });
  });

// ================= S2: the problem statement (10 - 14) =================
scene(10, 14, `
  <div class="bg-dark"></div>
  <div class="abs" style="inset:0">${stars(60, 9)}</div>
  <div class="abs" id="s2" style="inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px">
    <div class="h1 l1" style="color:#fff;font-size:112px">${words('Your company knows everything.')}</div>
    <div class="h1 l2" style="font-size:112px;color:rgba(255,255,255,.42)">${words('But nobody can ask it.')}</div>
  </div><div class="vignette"></div>`,
  e => ({ l1: $$(e, '.l1 .w'), l2: $$(e, '.l2 .w'), box: $(e, '#s2') }),
  (lt, e, c) => {
    animStars(e, lt + 10);
    animWords(c.l1, lt, 0.1, { stagger: 0.08 });
    animWords(c.l2, lt, 1.3, { stagger: 0.09 });
    const q = ei(r(lt, 3.35, 4));
    st(c.box, { transform: `scale(${1 - q * 0.97})`, opacity: 1 - r(lt, 3.7, 4), filter: q > 0.01 ? `blur(${q * 8}px)` : 'none' });
  });

// ================= S3: logo reveal (14 - 20) =================
function logoScene(a, b, taglines, opts = {}) {
  scene(a, b, `
    <div class="bg-dark"></div><div class="beam"></div>
    <div class="abs" style="inset:0">${stars(120, 13 + a)}</div>
    <svg class="abs" style="inset:0" width="1920" height="1080">${[0, 1, 2, 3].map(i => `<circle class="ring" cx="960" cy="${opts.cy || 500}" r="10" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>`).join('')}</svg>
    <div class="abs dot" style="left:952px;top:${(opts.cy || 500) - 8}px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 30px 10px rgba(80,160,255,.8)"></div>
    <div class="abs flash" style="inset:0;background:radial-gradient(circle at 50% 46%, rgba(255,255,255,.9), rgba(120,180,255,.2) 40%, transparent 70%);opacity:0"></div>
    <div class="abs lg" style="left:0;right:0;top:${(opts.cy || 500) - 150}px;display:flex;justify-content:center">${logoSVG({ h: 250 })}</div>
    <div class="abs tag" style="left:0;right:0;top:${(opts.cy || 500) + 150}px;text-align:center;color:#fff">${taglines}</div>

const GE = [[0, 1, 'UPDATES'], [1, 2, 'DEPENDS ON'], [3, 4, 'ANSWERS'], [0, 3, 'RELATES TO'], [2, 4, null]];
function graphField(seed, n, x0, y0, x1, y1, avoid = []) {
  const R = rng(seed), pts = [];
  let guard = 0;
  while (pts.length < n && guard++ < 5000) {
    const p = { x: x0 + R() * (x1 - x0), y: y0 + R() * (y1 - y0), s: 8 + R() * 14, k: ['mail', 'msg', 'meet', 'doc'][Math.floor(R() * 4)] };
    if (pts.some(q => Math.hypot(q.x - p.x, q.y - p.y) < 78)) continue;
    if (avoid.some(a => Math.abs(a.x - p.x) < 190 && Math.abs(a.y - p.y) < 75)) continue;
    pts.push(p);
  }
  const edges = [];
  pts.forEach((p, i) => {
    const near = pts.map((q, j) => [Math.hypot(q.x - p.x, q.y - p.y), j]).filter(([d, j]) => j !== i).sort((a, b) => a[0] - b[0]).slice(0, 2);
    near.forEach(([d, j]) => { if (!edges.some(([a, b]) => (a === j && b === i))) edges.push([i, j]); });
  });
  return { pts, edges };
}
