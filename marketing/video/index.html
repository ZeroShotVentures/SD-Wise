<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(fonts/inter.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:OpenSansL;src:url(fonts/opensans.woff2) format('woff2');font-weight:300 800}
@font-face{font-family:Mono;src:url(fonts/mono.woff2) format('woff2');font-weight:100 900}
:root{
  --navy:#0c1720;--navy2:#132636;--ink:#1d2830;--muted:#5f6b76;--line:#e3e7ec;--canvas:#f4f5f8;
  --gray:#7b86a2;--red:#d6003a;--yellow:#f5ac00;--amber:#e39a00;--blue:#006dd8;--logoText:#596276;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--navy);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0;will-change:transform,opacity,filter}
.bg-dark{position:absolute;inset:0;background:
  radial-gradient(1200px 800px at 70% 20%, rgba(0,109,216,.28), transparent 60%),
  radial-gradient(900px 700px at 10% 90%, rgba(214,0,58,.10), transparent 60%),
  linear-gradient(160deg,#0f2030 0%,#0b1620 55%,#08111a 100%)}
.bg-dark::after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.3px);background-size:34px 34px}
.bg-light{position:absolute;inset:0;background:linear-gradient(180deg,#f7f8fb,#eef1f6)}
.bg-light::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(29,40,48,.10) 1px,transparent 1.3px);background-size:30px 30px}
.abs{position:absolute}
.kt .w{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
.label{font-family:Mono;font-size:20px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.h1{font-weight:650;letter-spacing:-.035em;line-height:1.02}
.sub{font-size:28px;line-height:1.45;font-weight:420;letter-spacing:-.005em}
/* cards */
.card{position:absolute;left:0;top:0;width:380px;padding:18px 20px;border-radius:18px;background:#fff;
  box-shadow:0 24px 60px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.2);display:flex;gap:14px;align-items:center;will-change:transform,filter,opacity}
.card .ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.card .who{font-size:18px;font-weight:650;color:#1d2830;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .line{font-size:16px;color:#4a5560;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-family:Mono;font-size:12px;color:#8a95a0;margin-top:6px;letter-spacing:.04em}
.card .tx{min-width:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;font-family:Mono;font-size:18px;letter-spacing:.04em}
.avatar{position:absolute;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:26px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.tag{position:absolute;white-space:nowrap;background:rgba(255,255,255,.96);color:#1d2830;font-size:17px;font-weight:600;padding:8px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tile{position:absolute;width:84px;height:84px;border-radius:22px;display:grid;place-items:center;box-shadow:0 14px 34px rgba(20,30,40,.18)}
.fact{position:absolute;width:420px;background:#fff;border:1px solid #e3e7ec;border-radius:18px;padding:16px 18px;box-shadow:0 18px 44px rgba(20,30,40,.12);display:flex;gap:14px;align-items:flex-start}
.fact .ic{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.fact .t{font-size:19px;font-weight:650;color:#1d2830;letter-spacing:-.01em}
.fact .m{font-size:14px;color:#6b7680;margin-top:5px;font-family:Mono;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.dot{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;font-family:Inter;margin-left:-6px;border:2px solid #fff}
.panel{position:absolute;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;backdrop-filter:blur(6px)}
.glass{background:rgba(255,255,255,.97);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
#wipe div{position:absolute;top:-20%;height:140%;transform-origin:center}
</style>
</head>
<body>
<div id="stage">
  <section class="scene" id="s1"><div class="bg-dark"></div></section>
  <section class="scene" id="s2"></section>
  <section class="scene" id="s3"><div class="bg-dark"></div></section>
  <section class="scene" id="c1"><div class="bg-light"></div></section>
  <section class="scene" id="c2"><div class="bg-light"></div></section>
  <section class="scene" id="c3"><div class="bg-dark"></div></section>
  <section class="scene" id="c4"><div class="bg-dark"></div></section>
  <section class="scene" id="c5"><div class="bg-light"></div></section>
  <section class="scene" id="c6"><div class="bg-light"></div></section>
  <section class="scene" id="f7"><div class="bg-dark"></div></section>
  <section class="scene" id="s8"><div class="bg-dark"></div></section>
  <section class="scene" id="s9"><div class="bg-dark"></div></section>
  <div id="wipe" class="abs" style="inset:0;pointer-events:none"></div>
  <div id="fade" class="abs" style="inset:0;background:#000;opacity:0"></div>
</div>
<script>
// ---------- helpers ----------
const W=1920,H=1080;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,d)=>clamp((t-a)/d);
const eo=t=>1-Math.pow(1-clamp(t),3);
const eo5=t=>1-Math.pow(1-clamp(t),5);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const ex=t=>{t=clamp(t);return t>=1?1:1-Math.pow(2,-10*t)};
const eback=t=>{t=clamp(t);const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const $=id=>document.getElementById(id);
function mk(parent,cls,html,style){const d=document.createElement('div');if(cls)d.className=cls;if(html!=null)d.innerHTML=html;if(style)d.style.cssText=style;parent.appendChild(d);return d}
function S(el,{x=0,y=0,s=1,r=0,o=1,b=0,sx,sy}={}){
  const scl = (sx!=null||sy!=null)?`scale(${sx??s},${sy??s})`:`scale(${s})`;
  el.style.transform=`translate(${x}px,${y}px) ${scl} rotate(${r}deg)`;
  el.style.opacity=o; el.style.filter=b>0.05?`blur(${b}px)`:'none';
}
// glyphs (24x24, stroked)
const GL={
  mail:"M4 6.5h16v11H4z M4 7l8 6.2L20 7",
  hash:"M9.5 4L7.5 20 M16.5 4l-2 16 M4.5 9h16 M3.5 15h16",
  video:"M3 7h12v10H3z M15 11l6-3.5v9L15 13",
  chat:"M4 5h16v11H10l-5 4v-4H4z",
  doc:"M6.5 3h7.5l4 4v14h-11.5z M14 3v4h4 M9.5 12h5 M9.5 16h5",
  lock:"M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3",
  check:"M5 12.5l4.5 4.5L19 7.5",
  search:"M10.5 17.5a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M15.5 15.5L21 21",
  spark:"M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z",
  person:"M12 11.5a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4.5 21c.8-4 3.8-6.3 7.5-6.3s6.7 2.3 7.5 6.3",
};
const SRC={
  outlook:{c:'#0a64d6',g:'mail',n:'Outlook'}, gmail:{c:'#e5463b',g:'mail',n:'Gmail'},
  slack:{c:'#5b1f5f',g:'hash',n:'Slack'}, teams:{c:'#5b5fc7',g:'chat',n:'Teams'},
  meet:{c:'#0e8a6d',g:'video',n:'Meet'}, zoom:{c:'#2d7cf6',g:'video',n:'Zoom'},
  doc:{c:'#1f6f4a',g:'doc',n:'SharePoint'}, hr:{c:'#d6003a',g:'lock',n:'HR'},
  tmeet:{c:'#464eb8',g:'video',n:'Teams meetings'}, answer:{c:'#14b88a',g:'spark',n:'Answer'},
};
const svg=(g,size=24,stroke='#fff',sw=2)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="${GL[g]}"/></svg>`;
const PEOPLE={B:['Bram','#e07a2e'],L:['Lotte','#b0347a'],D:['Dario','#2f8f6b'],V:['Victor','#c9892a'],J:['Julien','#7a5bd6'],K:['Kobe','#3a6fd8'],A:['An','#2a9bb0'],S:['Sofie','#d0496b'],T:['Timon','#5b8a2e'],P:['Pieter','#8a6e4b']};
const dots=ids=>ids.map((k,i)=>`<span class="dot" style="background:${PEOPLE[k][1]};${i==0?'margin-left:0':''}">${k}</span>`).join('');

// logo (paths from the SD Wise mark)
function logo(dark,withText=true){
  const tc=dark?'#ffffff':'#596276';
  return `<svg viewBox="0 0 ${withText?2000:520} 690" style="display:block;width:100%;height:100%;overflow:visible">
   <g class="bars">
    <polygon class="b0" points="0,348 86,348 119,537 34,537" fill="#7b86a2"/>
    <polygon class="b1" points="193,192 286,192 229,690 138,690" fill="#d6003a"/>
    <polygon class="b2" points="405,0 501,0 383,537 292,537" fill="#f2a900"/>
   </g>
   ${withText?`<g class="wm"><text x="478" y="537" font-family="OpenSansL" font-weight="560" font-size="486" letter-spacing="-8" fill="${tc}">sd wise</text></g>`:''}
  </svg>`;
}

// kinetic text: words slide up + unblur
function kt(parent,lines,style,cls='kt h1'){
  const el=mk(parent,cls,null,style);
  el._w=[];
  lines.forEach((ln,li)=>{
    const row=mk(el,'row',null,'display:block');
    ln.split(' ').forEach((w,wi,arr)=>{
      let color=null; let txt=w;
      if(w.startsWith('*')){txt=w.slice(1);color='acc'}
      const sp=document.createElement('span');sp.className='w';sp.textContent=txt+(wi<arr.length-1?' ':'');
      if(color)sp.dataset.acc=1;
      row.appendChild(sp);el._w.push(sp);
    });
  });
  return el;
}
function ktU(el,t,t0,{st=0.07,d=0.6,dy=46,out=1e9,od=0.35,acc}={}){
  el._w.forEach((sp,i)=>{
    const p=ex(prog(t,t0+i*st,d));
    const q=eio(prog(t,out,od));
    if(acc&&sp.dataset.acc)sp.style.color=acc;
    sp.style.transform=`translateY(${(1-p)*dy - q*20}px)`;
    sp.style.opacity=p*(1-q);
    const b=(1-p)*14+q*12; sp.style.filter=b>0.05?`blur(${b}px)`:'none';
  });
}
function fadeIn(el,t,t0,{d=0.6,dy=30,out=1e9,od=0.35,x=0}={}){
  const p=ex(prog(t,t0,d)), q=eio(prog(t,out,od));
  S(el,{x,y:(1-p)*dy-q*16,o:p*(1-q),b:(1-p)*10+q*10});
}
function scene(el,t,a,b,{inD=0.45,outD=0.3,inFx='zoom',outFx='blur'}={}){
  if(t<a-0.001||t>b+outD){el.style.display='none';return false}
  el.style.display='block';
  const pi=ex(prog(t,a,inD)), po=eio(prog(t,b,outD));
  let s=1,bl=0,o=1;
  if(inFx==='zoom'){s*=lerp(1.08,1,pi);bl+=(1-pi)*16;o*=clamp(pi*2)}
  if(inFx==='cut'){}
  if(inFx==='fade'){o*=pi}
  if(outFx==='blur'){s*=lerp(1,0.94,po);bl+=po*18;o*=1-po}
  if(outFx==='cut'){if(t>=b){el.style.display='none';return false}}
  if(outFx==='zoom'){s*=lerp(1,1.25,po);bl+=po*22;o*=1-po}
  el.style.opacity=o;el.style.transform=`scale(${s})`;el.style.filter=bl>0.05?`blur(${bl}px)`:'none';
  return true;
}
const typed=(str,t,t0,cps=22)=>{const n=Math.floor(clamp((t-t0)*cps,0,str.length));return str.slice(0,n)};
const caret=(t,t0,t1)=>(t>=t0&&t<t1&&Math.floor(t*2.4)%2==0)?'<span style="opacity:.9">|</span>':'';
const fmt=n=>Math.round(n).toLocaleString('en-US');


// ================= TIMELINE =================
const T={s2:5.5,s3:9.5,c1:12.5,c2:21.0,c3:29.0,c4:39.0,c5:46.0,c6:53.0,f7:59.5,s8:63.5,s9:67.5,end:72.0};
const DUR=T.end;

// ================= S1 : scattered =================
const s1=$('s1');
const cardLayerBack=mk(s1,'abs',null,'inset:0');
const s1Center=mk(s1,'abs',null,'inset:0');
const cardLayerFront=mk(s1,'abs',null,'inset:0');
const CT=[
 ['outlook','Lotte Janssens','RE: Kras contract terms','OUTLOOK · 09:12'],
 ['slack','#payroll-engine','Can\'t close v3 until indexation is in','SLACK · 2 MIN'],
 ['tmeet','Kras renewal prep','Transcript · 42 min','TEAMS MEETING'],
 ['teams','Bram & Victor','Kras asked about the API again','TEAMS CHAT'],
 ['outlook','An Maes','Indexation update — PC 200','OUTLOOK · MON'],
 ['teams','Sofie Peeters','Let\'s take the salary review offline','TEAMS CHAT'],
 ['zoom','Client call · Kras','Recording · 31 min','ZOOM'],
 ['slack','#sales-benelux','Kras signed in spring 2024','SLACK · 1 H'],
 ['tmeet','Product roadmap Q4','Decision: v3 GA in March','TEAMS MEETING'],
 ['gmail','Pieter Claes','Holiday pay tickets again?','GMAIL · 08:47'],
 ['slack','#support','Payslip PDF bug is back','SLACK · 5 MIN'],
 ['teams','Kobe Willems','OAuth 2.1 ships before v3','TEAMS CHAT'],
 ['meet','AI tooling budget','Notes · 6 action items','GOOGLE MEET'],
 ['outlook','Dario','Fwd: LLM vendor shortlist','OUTLOOK · TUE'],
];
seed=11;
const cards=[];
for(let i=0;i<46;i++){
  const c=CT[i%CT.length]; const sc=SRC[c[0]];
  const z=0.45+rnd()*0.95;
  const front=z>1.22;
  const el=mk(front?cardLayerFront:cardLayerBack,'card',
    `<div class="ic" style="background:${sc.c}">${svg(sc.g,26)}</div><div class="tx"><div class="who">${c[1]}</div><div class="line">${c[2]}</div><div class="meta">${c[3]}</div></div>`);
  let x=rnd()*(W+500)-250, y=rnd()*(H+260)-130;
  cards.push({el,z,x,y,vx:(rnd()-.5)*70,vy:(rnd()-.5)*40-6,r:(rnd()-.5)*10,t0:i*0.07+rnd()*0.15,ang:Math.atan2(y-H/2,x-W/2)});
}
cards.sort((a,b)=>a.z-b.z).forEach(c=>c.el.parentNode.appendChild(c.el));
const s1Kicker=mk(s1Center,'abs label',"Your company's knowledge lives",'left:0;right:0;top:380px;text-align:center;color:rgba(255,255,255,.7);font-size:24px');
const WORDS=[[0.35,'In inboxes.'],[1.15,'In meetings.'],[1.95,'In chats.'],[2.75,"In people's heads."]];
const s1Words=WORDS.map(([tt,w])=>{const e=kt(s1Center,[w],'position:absolute;left:0;right:0;top:430px;text-align:center;color:#fff;font-size:150px;text-shadow:0 10px 60px rgba(0,0,0,.5)');e._t=tt;return e});
const s1Count=mk(s1,'abs pill',`<span style="width:10px;height:10px;border-radius:50%;background:#f2a900;display:inline-block"></span><span class="n">0</span>&nbsp;messages · meetings · decisions`,'left:50%;top:48px;transform:translateX(-50%);background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.14)');
const HEADS=[['V',400,240,'knows why v3 is blocked'],['B',1470,220,'knows what Kras was promised'],['S',300,780,'holds the salary reviews'],['A',1540,770,'has the 2027 indexation numbers'],['P',850,870,'knows the top ticket driver'],['L',1130,140,'knows the real Kras price']];
const heads=HEADS.map(([k,x,y,txt],i)=>{
  const a=mk(s1,'avatar',k,`left:${x}px;top:${y}px;width:86px;height:86px;background:${PEOPLE[k][1]};border:4px solid rgba(255,255,255,.9)`);
  const tg=mk(s1,'tag',`<span style="color:${PEOPLE[k][1]}">${PEOPLE[k][0]}</span> · ${txt}`,`left:${x+100}px;top:${y+22}px`);
  return {a,tg,x,y,t0:2.85+i*0.09};
});
function s1U(t){
  const dim=eio(prog(t,5.2,0.6));
  const imp=eio(prog(t,8.55,0.9));
  const fly=eio(prog(t,2.6,1.3));
  cards.forEach(c=>{
    const p=eback(prog(t,c.t0,0.55));
    const tt=Math.max(0,t-c.t0);
    let x=c.x+c.vx*tt*c.z, y=c.y+c.vy*tt*c.z;
    const push=fly*240*c.z;
    x+=Math.cos(c.ang)*push; y+=Math.sin(c.ang)*push;
    x=lerp(x,W/2-190,imp); y=lerp(y,H/2-50,imp);
    const s=c.z*lerp(0.55,1,p)*lerp(1,0.05,imp);
    const b=Math.abs(c.z-0.95)*5.5+(1-p)*10+dim*5+imp*6;
    const o=clamp(p*1.4)*lerp(lerp(1,c.z>1.22?0.0:0.35,dim),0.8,imp)*(1-Math.pow(imp,3));
    S(c.el,{x,y,s,r:c.r*(1-imp),o:clamp(o),b});
  });
  s1Center.style.display=t>5.8?'none':'block';
  fadeIn(s1Kicker,t,0.15,{out:5.1});
  s1Words.forEach((e,i)=>{const nxt=i<3?WORDS[i+1][0]-0.12:5.1;ktU(e,t,e._t,{st:0.05,d:0.45,out:nxt,od:0.16})});
  s1Words[3]._w.forEach((w,i)=>{if(i>0)w.style.color='#f2a900'});
  s1Count.querySelector('.n').textContent=fmt(Math.pow(clamp(t/5.1),1.6)*1284211);
  s1Count.style.opacity=clamp(t/0.4)*(1-prog(t,5.0,0.4));
  heads.forEach(h=>{
    const p=eback(prog(t,h.t0,0.5)), q=eio(prog(t,5.1,0.4));
    S(h.a,{s:p*(1-q*0.4),o:clamp(p)*(1-q),b:q*8});
    const p2=ex(prog(t,h.t0+0.15,0.5));
    S(h.tg,{x:(1-p2)*-20,o:p2*(1-q),b:(1-p2)*6+q*8});
  });
}

// ================= S2 : statement =================
const s2=$('s2');
const s2a=kt(s2,['Your company knows more','than *anyone *in *it.'],'position:absolute;left:0;right:0;top:360px;text-align:center;color:#fff;font-size:118px');
const s2b=kt(s2,['What if it could','*think *as *one?'],'position:absolute;left:0;right:0;top:360px;text-align:center;color:#fff;font-size:118px');
function s2U(t){
  ktU(s2a,t,5.55,{st:0.08,out:7.3,od:0.25,acc:'#f2a900'});
  ktU(s2b,t,7.45,{st:0.09,out:9.2,od:0.3,acc:'#f2a900'});
}

// ================= S3 : logo =================
const s3=$('s3');
const s3rays=document.createElement('canvas');s3rays.width=W;s3rays.height=H;s3rays.style.cssText='position:absolute;inset:0';s3.appendChild(s3rays);
const s3logo=mk(s3,'abs',logo(true),'left:460px;top:350px;width:1000px;height:345px');
const s3sub=mk(s3,'abs',"One mind for your whole company.",'left:0;right:0;top:760px;text-align:center;color:rgba(255,255,255,.9);font-size:42px;font-weight:550;letter-spacing:-.02em');
function barsU(root,t,t0){
  const bs=root.querySelectorAll('.bars polygon');
  bs.forEach((b,i)=>{
    const p=eo5(prog(t,t0+i*0.09,0.55));
    b.style.transform=`translate(${(1-p)*(i==1?120:-160)}px,${(1-p)*(i==1?-900:900)}px)`;
    b.style.opacity=clamp(p*3);
  });
  const wm=root.querySelector('.wm');
  if(wm){const p=ex(prog(t,t0+0.35,0.8));wm.style.transform=`translateX(${(1-p)*-90}px)`;wm.style.opacity=p;wm.style.filter=p<1?`blur(${(1-p)*20}px)`:'none'}
}
function raysU(cv,t,t0,strength=1,rot=0){
  const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const p=prog(t,t0,1.6); if(p<=0||p>=1)return;
  ctx.save();ctx.translate(W/2,H/2);seed=99;
  for(let i=0;i<90;i++){
    const a=rnd()*Math.PI*2+rot, sp=0.6+rnd()*1.4, len=80+rnd()*260;
    const r0=ex(p)*sp*1400;
    ctx.strokeStyle=`rgba(255,255,255,${(1-p)*0.55*strength*(0.4+rnd()*0.6)})`;ctx.lineWidth=1+rnd()*2.2;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);ctx.lineTo(Math.cos(a)*(r0+len),Math.sin(a)*(r0+len));ctx.stroke();
  }
  ctx.strokeStyle=`rgba(255,255,255,${(1-p)*0.35*strength})`;ctx.lineWidth=2;

    const rp=prog(t,t0,0.8);if(rp<1){ctx.strokeStyle=`rgba(20,184,138,${(1-rp)*.6})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,14+rp*40,0,7);ctx.stroke()}}
  c6count.querySelector('.n').textContent=fmt(1284211+Math.floor(Math.pow(prog(t,l+1.2,5),1.4)*2400));
  c6count.style.opacity=ex(prog(t,l+0.8,0.5))*(1-prog(t,T.f7-0.3,0.3));
}

// ================= F7 : feature burst =================
const f7=$('f7');
const f7cv=mkCanvas(f7);
const FEAT=['Multi-hop reasoning.','Facts, not files.','Owned by who was there.','Access on every fact.','Private connections.','Time-aware memory.','Routes to people.','Learns from answers.'];
const f7words=FEAT.map(w=>kt(f7,[w],'position:absolute;left:0;right:0;top:450px;text-align:center;color:#fff;font-size:118px'));
const f7num=mk(f7,'abs label','','left:0;right:0;top:390px;text-align:center;color:#f2a900;font-size:22px');
function f7U(t){
  const l=T.f7,st=0.5;
  f7words.forEach((e,i)=>ktU(e,t,l+i*st,{st:0.04,d:0.35,dy:60,out:l+(i+1)*st-0.08,od:0.1}));
  const k=clamp(Math.floor((t-l)/st),0,7);f7num.textContent=`0${k+1} / 08`;f7num.style.opacity=t<T.s8-0.1?1:0;
  const ctx=f7cv.getContext('2d');ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);
  seed=3;for(let i=0;i<72;i++){const a=i/72*Math.PI*2+t*0.12*(i%2?1:-1);const r0=360+rnd()*260+((t-l)*2%1)*40,len=40+rnd()*220;
    ctx.strokeStyle=`rgba(255,255,255,${.05+rnd()*.12})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);ctx.lineTo(Math.cos(a)*(r0+len),Math.sin(a)*(r0+len));ctx.stroke()}
  const bp=((t-l)/st)%1;ctx.strokeStyle=`rgba(242,169,0,${(1-bp)*.35})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,300+ex(bp)*500,0,7);ctx.stroke();
  ctx.restore();
}

// ================= S8 : greater than the sum =================
const s8=$('s8');
const s8cv=mkCanvas(s8);
const TERMS=['Inboxes','+','Meetings','+','Chats','+','People'];
const s8row=mk(s8,'abs h1',null,'left:0;right:0;top:470px;text-align:center;color:#fff;font-size:72px;white-space:nowrap');
const s8t=TERMS.map(w=>{const sp=document.createElement('span');sp.textContent=w;sp.style.cssText=`display:inline-block;margin:0 12px;${w=='+'?'color:#f2a900;font-weight:500':''}`;s8row.appendChild(sp);return sp});
const s8h=kt(s8,['Greater than','the *sum *of *its *people.'],'position:absolute;left:0;right:0;top:370px;text-align:center;color:#fff;font-size:132px');
function raysU2(ctx,t,t0){
  const p=prog(t,t0,1.3);if(p<=0||p>=1)return;ctx.save();ctx.translate(W/2,H/2);seed=21;
  for(let i=0;i<110;i++){const a=rnd()*Math.PI*2,sp=.5+rnd()*1.5,len=60+rnd()*300;const r0=ex(p)*sp*1300;
    ctx.strokeStyle=`rgba(255,${200+rnd()*55|0},${120+rnd()*135|0},${(1-p)*.6})`;ctx.lineWidth=1+rnd()*2.5;ctx.beginPath();ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);ctx.lineTo(Math.cos(a)*(r0+len),Math.sin(a)*(r0+len));ctx.stroke()}
  ctx.restore();
}
function s8U(t){
  const l=T.s8;
  const ctx=s8cv.getContext('2d');ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);const intro=ex(prog(t,l,0.8));
  for(let r=0;r<4;r++){ctx.strokeStyle=`rgba(255,255,255,${.07*intro})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,260+r*170,0,7);ctx.stroke()}
  ctx.restore();
  const col=eio(prog(t,l+1.6,0.4));
  s8t.forEach((sp,i)=>{
    const t0=l+0.1+Math.floor(i/2)*0.4+(i%2)*0.2;const p=ex(prog(t,t0,0.4));
    const rect=sp.offsetLeft+sp.offsetWidth/2-W/2;
    sp.style.transform=`translate(${-rect*col}px,${(1-p)*40}px) scale(${lerp(1,0.2,col)})`;
    sp.style.opacity=p*(1-col);sp.style.filter=`blur(${(1-p)*12+col*10}px)`;
  });
  raysU2(ctx,t,l+1.9);
  ktU(s8h,t,l+2.0,{st:0.08,out:T.s9-0.25,acc:'#f2a900',dy:60});
}

// ================= S9 : end card =================
const s9=$('s9');
const s9cv=mkCanvas(s9);
const s9logo=mk(s9,'abs',logo(true),'left:585px;top:320px;width:750px;height:259px');
const s9tag=mk(s9,'abs',"One mind for your whole company.",'left:0;right:0;top:650px;text-align:center;color:#fff;font-size:44px;font-weight:600;letter-spacing:-.02em');
const s9sub=mk(s9,'abs label',"Listens · Connects · Reasons · Respects · Routes · Learns",'left:0;right:0;top:728px;text-align:center;color:rgba(255,255,255,.55);font-size:19px');
function s9U(t){
  const l=T.s9;
  barsU(s9logo,t,l+0.15);
  raysU(s9cv,t,l+0.35,0.7,1);
  S(s9logo,{s:lerp(1.06,1,eo(prog(t,l,3)))});
  fadeIn(s9tag,t,l+1.1);fadeIn(s9sub,t,l+1.5);
  $('fade').style.opacity=eio(prog(t,T.end-0.8,0.8));
}

// ---------- wipe (brand slashes) ----------
const wipe=$('wipe');
const WB=[mk(wipe,'',null,'width:220px;background:#7b86a2'),mk(wipe,'',null,'width:220px;background:#d6003a'),mk(wipe,'',null,'width:260px;background:#f2a900'),mk(wipe,'',null,'width:5200px')];
function wipeU(t,tc,finalColor,dir=1){
  if(Math.abs(t-tc)>0.9)return false;
  WB[3].style.background=finalColor;
  const v=6200,bigW=5200,cx=(t-tc)*v*dir;
  const pos=[cx+dir*(bigW/2+620),cx+dir*(bigW/2+380),cx+dir*(bigW/2+130),cx];
  WB.forEach((d,i)=>{const w=parseFloat(d.style.width);d.style.left=(W/2+pos[i]-w/2)+'px';d.style.transform='skewX(-18deg)'});
  return true;
}

// ---------- master ----------
function render(t){
  if(scene(s1,t,0,T.s3-0.01,{inD:0.01,inFx:'cut',outFx:'cut'}))s1U(t);
  if(scene(s2,t,T.s2-0.05,T.s3-0.01,{inD:0.01,inFx:'cut',outFx:'cut'}))s2U(t);
  if(scene(s3,t,T.s3,T.c1,{inD:0.01,inFx:'cut',outFx:'cut'}))s3U(t);
  if(scene($('c1'),t,T.c1,T.c2-0.15,{inD:0.01,inFx:'cut',outD:0.3}))c1U(t);
  if(scene($('c2'),t,T.c2-0.1,T.c3,{inD:0.45,inFx:'zoom',outFx:'cut'}))c2U(t);
  if(scene($('c3'),t,T.c3,T.c4-0.2,{inD:0.01,inFx:'cut',outD:0.3}))c3U(t);
  if(scene($('c4'),t,T.c4-0.05,T.c5,{inD:0.45,inFx:'zoom',outFx:'cut'}))c4U(t);
  if(scene($('c5'),t,T.c5,T.c6-0.15,{inD:0.01,inFx:'cut',outD:0.3}))c5U(t);
  if(scene($('c6'),t,T.c6-0.1,T.f7,{inD:0.45,inFx:'zoom',outFx:'cut'}))c6U(t);
  if(scene(f7,t,T.f7,T.s8,{inD:0.01,inFx:'cut',outFx:'cut'}))f7U(t);
  if(scene(s8,t,T.s8,T.s9-0.2,{inD:0.3,inFx:'zoom',outD:0.3}))s8U(t);
  if(scene(s9,t,T.s9,T.end+1,{inD:0.5,inFx:'fade'}))s9U(t);
  const w=wipeU(t,T.c1,'#f4f5f8')||wipeU(t,T.c3,'#0e1d2a')||wipeU(t,T.c5,'#f4f5f8')||wipeU(t,T.f7,'#0e1d2a');
  wipe.style.display=w?'block':'none';
}
window.render=render;window.DUR=DUR;
Promise.all(['600 20px Inter','500 20px Mono','560 20px OpenSansL','700 11px Inter','600 13px Mono'].map(f=>document.fonts.load(f))).then(()=>document.fonts.ready).then(()=>{window.READY=true;render(parseFloat(location.hash.slice(1)||'0'))});
</script>
